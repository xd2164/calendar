<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Backend Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .status-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            animation: pulse 2s infinite;
        }

        .status-indicator.online {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        }

        .status-indicator.offline {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                box-shadow: 0 0 0 30px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .status-text.online {
            color: #059669;
        }

        .status-text.offline {
            color: #dc2626;
        }

        .status-details {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #64748b;
        }

        .detail-value {
            color: #1e293b;
            font-family: monospace;
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        button {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #3730a3;
            transform: translateY(-2px);
        }

        .loading {
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Backend Status</h1>
        
        <div id="statusIndicator" class="status-indicator">
            <span>⏳</span>
        </div>

        <div id="statusText" class="status-text loading">
            Checking status...
        </div>

        <div id="statusMessage" style="color: #64748b; margin-bottom: 1rem;">
            Connecting to backend...
        </div>

        <div class="status-details">
            <div class="detail-row">
                <span class="detail-label">API Endpoint:</span>
                <span class="detail-value" id="apiUrl">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status:</span>
                <span class="detail-value" id="apiStatus">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Response Time:</span>
                <span class="detail-value" id="responseTime">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Last Checked:</span>
                <span class="detail-value" id="lastChecked">-</span>
            </div>
        </div>

        <div class="actions">
            <button onclick="checkStatus()">🔄 Refresh</button>
            <button onclick="window.location.href='test-api.html'">🧪 Test API</button>
            <button onclick="window.location.href='index.html'">📅 Open Calendar</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000/api' 
            : '/api';

        async function checkStatus() {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const statusMessage = document.getElementById('statusMessage');
            const apiUrlEl = document.getElementById('apiUrl');
            const apiStatusEl = document.getElementById('apiStatus');
            const responseTimeEl = document.getElementById('responseTime');
            const lastCheckedEl = document.getElementById('lastChecked');

            // Reset to loading state
            indicator.innerHTML = '<span>⏳</span>';
            indicator.className = 'status-indicator';
            statusText.textContent = 'Checking status...';
            statusText.className = 'status-text loading';

            apiUrlEl.textContent = API_BASE_URL;

            try {
                const startTime = Date.now();
                const response = await fetch(API_BASE_URL + '/health');
                const responseTime = Date.now() - startTime;
                const data = await response.json();

                if (response.ok && data.status === 'ok') {
                    // Online
                    indicator.innerHTML = '<span>✓</span>';
                    indicator.className = 'status-indicator online';
                    statusText.textContent = 'Backend is Online';
                    statusText.className = 'status-text online';
                    statusMessage.textContent = data.message || 'All systems operational';
                    statusMessage.style.color = '#059669';
                    
                    apiStatusEl.textContent = '✓ Operational';
                    apiStatusEl.style.color = '#059669';
                } else {
                    throw new Error('Unexpected response');
                }

                responseTimeEl.textContent = responseTime + 'ms';
                lastCheckedEl.textContent = new Date().toLocaleTimeString();

            } catch (error) {
                // Offline
                indicator.innerHTML = '<span>✗</span>';
                indicator.className = 'status-indicator offline';
                statusText.textContent = 'Backend is Offline';
                statusText.className = 'status-text offline';
                statusMessage.textContent = 'Unable to connect to backend. Make sure the server is running.';
                statusMessage.style.color = '#dc2626';
                
                apiStatusEl.textContent = '✗ Offline';
                apiStatusEl.style.color = '#dc2626';
                responseTimeEl.textContent = 'N/A';
                lastCheckedEl.textContent = new Date().toLocaleTimeString();
            }
        }

        // Check status on load
        window.addEventListener('load', checkStatus);

        // Auto-refresh every 30 seconds
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
